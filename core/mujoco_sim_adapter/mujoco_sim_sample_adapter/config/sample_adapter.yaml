version: 1
namespace: mujoco_sim::sample_adapter::generated
name: SampleConfig
program: mujoco-sim-sample-adapter
description: Run the constant-command MuJoCo sample adapter
fields:
  server_name:
    type: string
    description: Server namespace
    default: default
    cli: [--server-name]
  adapter_id:
    type: string
    description: Adapter identifier
    default: sample_controller
    cli: [--adapter-id]
  observation_names:
    type: vector<string>
    description: Observation sensor names
    default: [hinge_pos, hinge_vel]
    unique: true
    cli: [--observations]
  command_names:
    type: vector<string>
    description: Command actuator names
    default: [hinge_motor]
    unique: true
    cli: [--commands]
  max_ticks:
    type: uint64
    description: Stop after this many ticks; zero is unlimited
    default: 0
    cli: [--ticks]
  command_value:
    type: double
    description: Constant value submitted to every command actuator
    default: 0.0
    finite: true
    cli: [--command-value]
  timeout_ms:
    type: uint32
    description: Controller commit timeout in milliseconds
    default: 1000
    cli: [--timeout-ms]
  service_timeout_ms:
    type: uint32
    description: Registry service timeout in milliseconds
    default: 5000
    cli: [--service-timeout-ms]
