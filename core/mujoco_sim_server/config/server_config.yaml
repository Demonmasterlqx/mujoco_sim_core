version: 1
namespace: mujoco_sim::server::generated
name: ServerConfig
program: mujoco-sim-server
description: Run the MuJoCo asynchronous simulation server
fields:
  server_name:
    type: string
    description: Server namespace
    default: default
    cli: [--server-name]
  model_path:
    type: path
    description: MuJoCo MJCF model path
    default: ""
    cli: [--model]
  initial_keyframe:
    type: string
    description: Named MuJoCo keyframe used as the initial state
    default: ""
    cli: [--initial-keyframe]
  max_ticks:
    type: uint64
    description: Stop successfully after this many ticks; zero is unlimited
    default: 0
    cli: [--max-ticks]
  pacing_mode:
    type: string
    description: Simulation pacing mode, realtime or unthrottled
    default: realtime
  realtime_factor:
    type: double
    description: Simulation time to wall time ratio in realtime mode
    default: 1.0
    finite: true
    min: 0.000001
  command_timeout_ms:
    type: uint32
    description: Time without a valid Controller command before OFFLINE
    default: 500
    min: 1
  command_keepalive_ms:
    type: uint32
    description: Granted SDK command keepalive period
    default: 100
    min: 1
  offline_session_expire_ms:
    type: uint32
    description: OFFLINE lifetime before automatic unregister; zero disables
    default: 0
  controller_state_every_n_steps:
    type: uint32
    description: Default Controller State cadence
    default: 1
    min: 1
  controller_state_period_s:
    type: double
    description: Simulation-time Controller State period; zero selects every_n_steps
    default: 0.0
    finite: true
    min: 0.0
  controller_state_max_rate_hz:
    type: double
    description: Maximum Controller State publication frequency
    default: 1000.0
    finite: true
    min: 0.000001
  startup_ctrl_policy:
    type: string
    description: startup ctrl policy
    default: zero
  offline_ctrl_policy:
    type: string
    description: offline ctrl policy
    default: hold_last
  error_ctrl_policy:
    type: string
    description: error ctrl policy
    default: zero
  release_ctrl_policy:
    type: string
    description: release ctrl policy
    default: zero
  controller_overrides:
    type: object_sequence
    items:
      type: object
      fields:
        adapter_id:
          type: string
          required: true
          non_empty: true
        command_timeout_ms:
          type: uint32
          default: 500
          min: 1
        command_keepalive_ms:
          type: uint32
          default: 100
          min: 1
        offline_session_expire_ms:
          type: uint32
          default: 0
        state_every_n_steps:
          type: uint32
          default: 1
          min: 1
        state_period_s:
          type: double
          default: 0.0
          finite: true
          min: 0.0
        startup_ctrl_policy:
          type: string
          default: zero
        offline_ctrl_policy:
          type: string
          default: hold_last
        error_ctrl_policy:
          type: string
          default: zero
        release_ctrl_policy:
          type: string
          default: zero
  session_timeout_ms:
    type: uint32
    description: Adapter presence timeout in milliseconds
    default: 1000
    min: 1
  observer_heartbeat_period_ms:
    type: uint32
    description: Observer keepalive period in milliseconds
    default: 250
    min: 100
  activation_timeout_ms:
    type: uint32
    description: Maximum time a provisional adapter may wait before activation
    default: 5000
    min: 1
    cli: [--activation-timeout-ms]
  status_period_ms:
    type: uint32
    description: Server status publication period in milliseconds
    default: 100
    min: 1
  status_min_interval_ms:
    type: uint32
    description: Minimum interval between non-terminal status publications
    default: 20
    min: 1
  observer_max_rate_hz:
    type: double
    description: Maximum accepted Observer delivery frequency
    default: 500.0
    finite: true
    min: 0.000001
  allow_every_step_observer:
    type: bool
    description: Allow Observer delivery on every simulation step
    default: false
  transport_subscriber_sample_period_ms:
    type: uint32
    description: Runtime transport subscriber metric sampling period
    default: 1000
    min: 1
  sensor_subscriber_sample_period_ms:
    type: uint32
    description: Sensor lazy-capture subscriber sampling period
    default: 200
    min: 1
  headless:
    type: bool
    description: Run mode with or without a graphical viewer
    default: false
    cli:
      flags: [--headless]
      inverse_flags: [--gui]
  viewer_sync_period_ms:
    type: uint32
    description: Graphical viewer snapshot capture period in milliseconds
    default: 16
    min: 1
    cli: [--viewer-sync-period-ms]
  log_level:
    type: enum
    description: Minimum server log level
    values: [trace, debug, info, warn, error, critical, "off"]
    default: info
    cli: [--log-level]
  log_file:
    type: path
    description: Optional rotating server log file
    default: ""
    cli: [--log-file]
  log_file_max_size_mb:
    type: uint32
    description: Maximum size of each rotating log file in MiB
    default: 10
    min: 1
    cli: [--log-file-max-size-mb]
  log_file_max_files:
    type: uint32
    description: Total number of rotating log files, including the active file
    default: 5
    min: 1
    max: 200000
    cli: [--log-file-max-files]
  log_summary_period_ms:
    type: uint32
    description: Runtime summary period in milliseconds; zero disables summaries
    default: 1000
    cli: [--log-summary-period-ms]
  render_backend:
    type: enum
    description: Offscreen sensor rendering backend
    values: [auto, egl, osmesa]
    default: auto
  sensor_streams:
    type: object_sequence
    items:
      type: object
      fields:
        name:
          type: string
          required: true
          non_empty: true
        kind:
          type: enum
          values: [rgb, depth, segmentation, camera_pointcloud, lidar_pointcloud]
          default: rgb
        source:
          type: string
          required: true
          non_empty: true
        frame_id:
          type: string
          required: true
          non_empty: true
        rate_hz:
          type: double
          default: 10.0
          finite: true
          min: 0.000001
          max: 1000000.0
        width:
          type: uint32
          default: 320
          min: 1
        height:
          type: uint32
          default: 240
          min: 1
        horizontal_samples:
          type: uint32
          default: 720
          min: 1
        vertical_samples:
          type: uint32
          default: 16
          min: 1
        vertical_fov_min_deg:
          type: double
          default: -15.0
          finite: true
          min: -90.0
          max: 90.0
        vertical_fov_max_deg:
          type: double
          default: 15.0
          finite: true
          min: -90.0
          max: 90.0
        min_range_m:
          type: double
          default: 0.15
          finite: true
          min: 0.0
        max_range_m:
          type: double
          default: 15.0
          finite: true
          min: 0.000001
        queue_mode:
          type: enum
          values: [latest, fifo, blocking]
          default: latest
        queue_depth:
          type: uint32
          default: 1
          min: 1
          max: 64
        fifo_overflow:
          type: enum
          values: [drop_oldest, drop_newest]
          default: drop_oldest
