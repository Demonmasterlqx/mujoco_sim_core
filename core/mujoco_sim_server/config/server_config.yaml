version: 1
namespace: mujoco_sim::server::generated
name: ServerConfig
program: mujoco-sim-server
description: Run the MuJoCo lockstep simulation server
fields:
  server_name:
    type: string
    description: Server namespace
    default: default
    cli: [--server-name]
  model_path:
    type: path
    description: MuJoCo MJCF model path
    default: ""
    cli: [--model]
  initial_keyframe:
    type: string
    description: Named MuJoCo keyframe used as the initial state
    default: ""
    cli: [--initial-keyframe]
  max_ticks:
    type: uint64
    description: Stop successfully after this many ticks; zero is unlimited
    default: 0
    cli: [--max-ticks]
  tick_timeout_ms:
    type: uint32
    description: Default Controller barrier or Observer keepalive timeout in milliseconds
    default: 1000
    cli: [--tick-timeout-ms]
  activation_timeout_ms:
    type: uint32
    description: Maximum time a provisional adapter may wait before activation
    default: 5000
    min: 1
    cli: [--activation-timeout-ms]
  allow_timed_out_adapter_replacement:
    type: bool
    description: Timed-out adapter replacement policy toggle
    default: true
    cli:
      flags: [--allow-timed-out-adapter-replacement]
      inverse_flags: [--deny-timed-out-adapter-replacement]
  status_period_ms:
    type: uint32
    description: Server status publication period in milliseconds
    default: 100
  headless:
    type: bool
    description: Run mode with or without a graphical viewer
    default: false
    cli:
      flags: [--headless]
      inverse_flags: [--gui]
  log_level:
    type: enum
    description: Minimum server log level
    values: [trace, debug, info, warn, error, critical, "off"]
    default: info
    cli: [--log-level]
  log_file:
    type: path
    description: Optional rotating server log file
    default: ""
    cli: [--log-file]
  log_file_max_size_mb:
    type: uint32
    description: Maximum size of each rotating log file in MiB
    default: 10
    min: 1
    cli: [--log-file-max-size-mb]
  log_file_max_files:
    type: uint32
    description: Total number of rotating log files, including the active file
    default: 5
    min: 1
    max: 200000
    cli: [--log-file-max-files]
  log_summary_period_ms:
    type: uint32
    description: Runtime summary period in milliseconds; zero disables summaries
    default: 5000
    cli: [--log-summary-period-ms]
  render_backend:
    type: enum
    description: Offscreen sensor rendering backend
    values: [auto, egl, osmesa]
    default: auto
  sensor_streams:
    type: object_sequence
    items:
      type: object
      fields:
        name:
          type: string
          required: true
          non_empty: true
        kind:
          type: enum
          values: [rgb, depth, segmentation, camera_pointcloud, lidar_pointcloud]
          default: rgb
        source:
          type: string
          required: true
          non_empty: true
        frame_id:
          type: string
          required: true
          non_empty: true
        rate_hz:
          type: double
          default: 10.0
          finite: true
          min: 0.000001
          max: 1000000.0
        width:
          type: uint32
          default: 320
          min: 1
        height:
          type: uint32
          default: 240
          min: 1
        horizontal_samples:
          type: uint32
          default: 720
          min: 1
        vertical_samples:
          type: uint32
          default: 16
          min: 1
        vertical_fov_min_deg:
          type: double
          default: -15.0
          finite: true
          min: -90.0
          max: 90.0
        vertical_fov_max_deg:
          type: double
          default: 15.0
          finite: true
          min: -90.0
          max: 90.0
        min_range_m:
          type: double
          default: 0.15
          finite: true
          min: 0.0
        max_range_m:
          type: double
          default: 15.0
          finite: true
          min: 0.000001
        queue_mode:
          type: enum
          values: [latest, fifo, blocking]
          default: latest
        queue_depth:
          type: uint32
          default: 1
          min: 1
          max: 64
        fifo_overflow:
          type: enum
          values: [drop_oldest, drop_newest]
          default: drop_oldest
